theme = "github-dark-default"
# theme = "tokyo-night" # any built-in theme id, auto, or custom
# theme = "github-dark-high-contrast" # any built-in theme id, auto, or custom
mode = "split"
vcs = "jj"                     # git, jj, sl
watch = true
exclude_untracked = false
line_numbers = true
wrap_lines = true
agent_notes = true
transparent_background = false


# NOTE: Without keybindings we have no wait to 
# split the key usage for `line_numbers` which is currently `l` to toggle them.
# and
# `scroll right` which is curretnly only bound to riht arrow...
# I want to bind line numbers to like, 
# idk - L or <S-l> and leave scrolling as vim-like lol
hunk_headers = false
menu_bar = true
copy_decorations = false
cursor_line = "row"
