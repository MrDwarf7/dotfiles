# yaml-language-server: $schema=https://gh-dash.dev/schema.json
prSections:
  - title: "Repo PR's"
    filters: is:open
    type: null
    #
  - title: "My PR's"
    filters: is:open author:@me
    type: null
  - title: "Needs My Review"
    filters: is:open review-requested:@me
    type: null
  - title: "Involved"
    filters: is:open involves:@me -author:@me
    # filters: is:open involves:@me
    type: null
issuesSections:
  - title: "Repo Issues"
    filters: is:open
    #
  - title: "My Issues"
    filters: is:open author:@me
  - title: "Assigned"
    filters: is:open assignee:@me
    # filters: is:open
  - title: "Involved"
    filters: is:open involves:@me -author:@me
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true
    width: 80
    position: "bottom" # "auto" | "right" | "bottom"
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  view: issues
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  universal:
    - key: "ctrl+e"
      builtin: pageDown
    - key: "ctrl+y"
      builtin: pageUp
  issues: []
  # - key: "t"
  #   builtin: "viewPrs"
  prs:
    # - key: "t"
    #   builtin: "viewIssues"
    # - key: "T"
    #   command: "gh-enhance -R {{ .RepoName }} {{ .PrNumber }}"
    - key: "T"
      command: >-
        tmux new-window 'gh-enhance -R {{.RepoName}} {{.PrNumber}}'
  branches: []
repoPaths: {}
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: ""
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
