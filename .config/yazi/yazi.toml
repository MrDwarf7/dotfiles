# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

# YAZI_CONFIG_HOME :: This needs to be on path and pointed to this DIR
# YAZI_FILE_ONE :: This needs to be pointed DIRECTLY at Git's file.exe binary (Yes. THE BINARY ITSELF)

[mgr]
show_hidden    = true
show_symlink   = true
linemode       = "mtime_better"
sort_by        = "natural"
ratio          = [1, 4, 3]
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
scrolloff      = 2
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
wrap          = "no"
tab_size      = 2
max_width     = 600
max_height    = 900
cache_dir     = ""
image_delay   = 30
image_filter  = "triangle"
image_quality = 75
# sixel_fraction  = 15
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = "nvim %*", block = true, desc = "nvim (block)", for = "windows" },
  { run = "code %*", orphan = true, desc = "VsCode", for = "windows" },

  { run = '${EDITOR:-nvim} "$@"', block = true, for = "unix", desc = "$EDITOR" },
]
open = [
  { run = "nvim %*", block = true, desc = "nvim (block)", for = "windows" },
  { run = 'xdg-open "$1"', desc = "Open", for = "linux" },
  { run = 'open "$@"', desc = "Open", for = "macos" },

  { run = 'termux-open "$1"', desc = "Open", for = "android" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", for = "linux" },
  { run = 'open -R "$1"', desc = "Reveal", for = "macos" },
  { run = 'explorer /select,"%1"', orphan = true, desc = "Reveal", for = "windows" },
  { run = 'termux-open "$(dirname "$1")"', desc = "Reveal", for = "android" },
  # { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
  { run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
  { run = 'vlc %*', orphan = true, for = "windows" },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', block = true, desc = "Show media info", for = "unix" },
]


[open]
prepend_rules = [
  { url = ".gitconfig", run = "nvim %*", use = ["open", "edit"], for = "windows" },
  { url = ".gitconfig", run = "nvim $@", use = ["open", "edit"], for = "linux" },
  { url = ".gitconfig", run = "nvim $@", use = ["open", "edit"], for = "unix" },

]
rules = [
  # application/wine-extension-ini
  { url = "application/wine-extension*", use = ["open", "edit", "reveal"] },
  # Folder
  { url = "*/", use = ["edit", "open", "reveal"] },
  # Text
  { mime = "text/*", use = ["edit", "reveal"] },
  # Image
  { mime = "image/*", use = ["open", "reveal"] },
  # Media
  { mime = "{audio,video}/*", use = ["play", "reveal"] },
  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = ["extract", "reveal"] },
  # JSON
  { mime = "application/{json,ndjson}", use = ["edit", "reveal"] },
  { mime = "*/javascript", use = ["edit", "reveal"] },
  # Empty file
  { mime = "inode/empty", use = ["edit", "reveal"] },
  # Fallback
  { url = "*", use = ["open", "reveal"] },
]

[tasks]
micro_workers = 10
macro_workers = 10
bizarre_retry = 3
image_alloc   = 536870912 # 512MB
# image_alloc      = 1073741824        # = 1024*1024*1024 = 1024MB
image_bound      = [0, 0]
suppress_preload = false

[plugin]
### fetchers are currently in early alpha as of `Yazi 26.2.2 (cc24147 2026-03-18)`
# prepend_fetchers = []
# append_fetchers  = []

prepend_previewers = [
  # Text / structured data preview plugins
  # { mime = "text/csv", run = "miller" },
  { url = "*.md", run = "rich-preview" },
  { url = "*.ipynb", run = "rich-preview" },
  { url = "*.json", run = "rich-preview" },
  { url = "*.jsonc", run = "rich-preview" },

  # ONLY add ( compression related ) items as needed.
  # The built-in previewer is generally much better these days
  # Ouch recommends these types tho:
  #
  # mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"

  # password protected files benefit from ouch, but no way to specify
  # { mime = "application/7z-compressed", run = "ouch" },

  { url = "*.csv", run = "duckdb" },
  { url = "*.tsv", run = "duckdb" },
  { url = "*.json", run = "duckdb" },
  # { url = "*.jsonc", run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  { url = "*.txt", run = "duckdb" },
  { url = "*.xlsx", run = "duckdb" },
  { url = "*.db", run = "duckdb" },
  { url = "*.duckdb", run = "duckdb" },

  { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  # image/gif is handled by ~/.config/mimeapps.list

  { mime = "audio/*", run = "exifaudio" },

  ### mediainfo plugin
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },

  # Adobe Photoshop is image/adobe.photoshop, already handled above
  # Adobe Illustrator
  { mime = "application/postscript", run = "mediainfo" },
  { mime = "application/illustrator", run = "mediainfo" },
  { mime = "application/dvb.ait", run = "mediainfo" },
  { mime = "application/vnd.adobe.illustrator", run = "mediainfo" },
  { mime = "image/x-eps", run = "mediainfo" },
  { mime = "application/eps", run = "mediainfo" },

  # Sometimes AI file is recognized as "application/pdf". Lmao.
  # In this case use file extension instead:
  { url = "*.{ai,eps,ait}", run = "mediainfo" },

]

append_previewers = []

prepend_preloaders = [
  { url = "*.csv", run = "duckdb", multi = false },
  { url = "*.tsv", run = "duckdb", multi = false },
  { url = "*.json", run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.txt", run = "duckdb", multi = false },
  { url = "*.xlsx", run = "duckdb", multi = false },


  ### mediainfo plugin
  # Replace magick, image, video with mediainfo
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { mime = "application/subrip", run = "mediainfo" },

  # Adobe Photoshop is image/adobe.photoshop, already handled above
  # Adobe Illustrator
  # { mime = "application/postscript", run = "mediainfo" },
  # { mime = "application/illustrator", run = "mediainfo" },
  # { mime = "application/dvb.ait", run = "mediainfo" },
  # { mime = "application/vnd.adobe.illustrator", run = "mediainfo" },
  # { mime = "image/x-eps", run = "mediainfo" },
  # { mime = "application/eps", run = "mediainfo" },

  # Sometimes AI file is recognized as "application/pdf". Lmao.
  # In this case use file extension instead:
  # { url = "*.{ai,eps,ait}", run = "mediainfo" },


]
append_preloaders = []


[input]
cursor_blink = true

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

# create
create_title  = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

# find
find_title  = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

# shell
shell_title  = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

[confirm]
# trash
trash_title  = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

# delete
delete_title  = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

# overwrite
overwrite_title = "Overwrite file?"
# overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

# quit
quit_title = "Quit?"
# quit_content = "The following tasks are still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

[which]
sort_by        = "none"
sort_sensitive = false
sort_reverse   = false
sort_translit  = false
