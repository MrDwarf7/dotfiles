##################################################


# ┌────────────────────────────────────┬─────────────────────────────────┬─────────────────────────────────┐
# │ Where it operates                  │ Exact TOML table                │ Action                          │
# ├────────────────────────────────────┼─────────────────────────────────┼─────────────────────────────────┤
# │ Window mode: create/close panes    │ [keybindings.window_management] │ new_window, close_window        │
# ├────────────────────────────────────┼─────────────────────────────────┼─────────────────────────────────┤
# │ Window mode: splits, swaps, sizing │ [keybindings.layout]            │ split_vertical, swap_left, etc. │
# ├────────────────────────────────────┼─────────────────────────────────┼─────────────────────────────────┤
# │ Terminal mode: direct shortcuts    │ [keybindings.terminal_mode]     │ terminal_focus_left, etc.       │
# ├────────────────────────────────────┼─────────────────────────────────┼─────────────────────────────────┤
# │ Immediately after the leader       │ [keybindings.prefix_mode]       │ prefix_split_vertical, etc.     │
# ├────────────────────────────────────┼─────────────────────────────────┼─────────────────────────────────┤
# │ Inside the layout prefix submenu   │ [keybindings.layout_prefix]     │ resize_width_50, etc.           │
# └────────────────────────────────────┴─────────────────────────────────┴─────────────────────────────────┘


