## TODO: Refactor this later to try and find a better alternative
# 
# Workspace ends follow occupied dock order; pane ends follow visual column order.
# Client-side SwitchWorkspace preserves bounce history; FocusWindow reveals the pane.
[[keybindings.command]]
key = "prefix+$"
type = "shell"
command = '''target=$(tuios list-workspaces -s "$TUIOS_SESSION" --json | jq -er '(.order // [.workspaces[].workspace]) as $order | [.workspaces[] | select(.window_count > 0)] | sort_by(.workspace as $n | $order | index($n)) | last.workspace') && tuios run-command -s "$TUIOS_SESSION" SwitchWorkspace "$target"'''
description = "Last occupied workspace"

[[keybindings.command]]
key = "prefix+^"
type = "shell"
command = '''target=$(tuios list-workspaces -s "$TUIOS_SESSION" --json | jq -er '(.order // [.workspaces[].workspace]) as $order | [.workspaces[] | select(.window_count > 0)] | sort_by(.workspace as $n | $order | index($n)) | first.workspace') && tuios run-command -s "$TUIOS_SESSION" SwitchWorkspace "$target"'''
description = "First occupied workspace"

# Prefix keys register these commands; the bare-key aliases above are window-only.
[[keybindings.command]]
name = "first-pane"
key = "prefix+home"
type = "shell"
command = '''target=$(tuios list-windows -s "$TUIOS_SESSION" --json | jq -er '.current_workspace as $ws | [.windows[] | select(.workspace == $ws and .minimized == false)] | sort_by(.x, .y) | first.window_id') && tuios run-command -s "$TUIOS_SESSION" FocusWindow "$target"'''
description = "First pane in scrolling layout"

[[keybindings.command]]
name = "last-pane"
key = "prefix+end"
type = "shell"
command = '''target=$(tuios list-windows -s "$TUIOS_SESSION" --json | jq -er '.current_workspace as $ws | [.windows[] | select(.workspace == $ws and .minimized == false)] | sort_by(.x, .y) | last.window_id') && tuios run-command -s "$TUIOS_SESSION" FocusWindow "$target"'''
description = "Last pane in scrolling layout"
