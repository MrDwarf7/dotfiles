  "!/home/*/.opam/*",
  "!/home/*/.ghcup/*",
  "!/home/*/.dotnet/*",
  "!/home/*/go/pkg/mod/golang.org",
  "!/home/*/.rustup/downloads/*",
  "!/home/*/.rustup/tmp/*",
