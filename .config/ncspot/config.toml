#Name = Description  Possible values  Default

#Key to open command line  Single character  :
command_key = ":"
#Screen to show after startup  "library", "search", "queue", "cover"[1]  "library"
initial_screen = "queue"
#Turn nerdfont glyphs on/off  true, false  false
use_nerdfont = true
#Reverse play/pause icon meaning[2]  true, false  false
flip_status_indicators = false
#Audio backend to use  String[3]  
### backend = 
#Audio device to configure the backend  String  
### backend_device = 
#Enable caching of audio files  true, false  true
audio_cache = true
#Maximum size of audio cache in MiB  Number  
### audio_cache_size = 
#Enable volume normalization  true, false  false
volnorm = true
#Normalization pregain to apply in dB (if enabled)  Number  0.0
volnorm_pregain = 0.0
#Enable default keybindings  true, false  false
### default_keybindings = false
#Enable desktop notifications  true, false  false
notify = false
#Audio bitrate to use for streaming  96, 160, 320  320
bitrate = 320
#Enable gapless playback  true, false  true
gapless = true
#Set default shuffle state  true, false  false
shuffle = true
#Set default repeat mode  "off", "track", "playlist"  "off"
repeat = "off"
#Set default playback state  "Stopped", "Paused", "Playing", "Default"  "Paused"
playback_state = "Paused"
#Tabs to show in library screen  Array of "tracks", "albums", "artists", "playlists", "podcasts", "browse"  All tabs
### library_tabs = 
#Set maximum scaling ratio for cover art  Number  1.0
cover_max_scale = 1.0
#Hides spotify usernames in the library header and on playlists  true, false  false
hide_display_names = false

#Set ap-port for librespot (for restrictive firewalls)  80, 443, 4070  
### ap_port =

#Formatting for tracks in the statusbar  See track_formatting  %artists - %track
# statusbar_format = "%artists - %track"
statusbar_format = "[%saved] %title - %artists"

# Set active fields shown in Library/Queue views  See track formatting  
# Available options for tracks:
# %artists, %artist, %title, %album, %saved, %duration. 
#
# %artists will show all contributing artists, while 
# %artist only shows the first listed artist.

## Default ::
# left = "%artists - %title"
# center = "%album"
# right = "%saved %duration"
[track_format]
left = "%title - %artists"
center = "Album: %album"
right = "%saved %duration"

# left = "|%saved| %duration | %title - %artists"
# center = ""
# right = "%album"


# Set the text displayed in notifications[4]  See notification formatting  
[notification_format]
## Default :: 
title = "%title"
body = "%artists"

