# Custom keybindings  See custom keybindings  
[keybindings]

"?" = "help"
"Backspace" = "back"
"Esc" = "back"


## Scrolling
"Ctrl+d" = "move down 20"
"Ctrl+u" = "move up 20"

## Document wide jumps
"Home" = "move top"
"End" = "move bottom"
"g" = "move top"
"Shift+g" = "move bottom"

## Tab jumping
"F1" = "focus search"
"F2" = "focus queue"
"F3" = "focus library"
"F8" = "focus cover"

"Shift+q" = "quit"
"q" = "focus queue"

"e" = "focus library"

## Sideways + Tab navigation(s)
"Left" = "move left 1"
"Down" = "move down 1"
"Up" = "move up 1"
"Right" = "move right 1"


## Previous && Next track
"<" = "previous"
">" = "next"

"Ctrl+p" = "previous"
"Ctrl+n" = "next"

## Track seeking
"Ctrl+h" = "seek -1000"
"Ctrl+l" = "seek +1000"
"Shift+h" = "seek -10000"
"Shift+l" = "seek +10000"


### Opens a menu to ask yes/no clear the queue?
"Shift+c" = "clear"
"c" = "move playing"

## Volume
"+" = "volup 1"
"-" = "voldown 1"
"[" = "voldown 5"
"]" = "volup 5"

## Misc commands
"Ctrl+r" = "redraw"

##### Compound commands
"." = "playnext; move down 1"
"p" = "queue; move down 1"

## 'browse' tab in library via lib -> tap 'L' multiple times to cycle through the different browse options
"b" = "focus library; move right 5"

