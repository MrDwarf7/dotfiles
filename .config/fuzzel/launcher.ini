[main]
include = ~/.config/fuzzel/themes/mocha-mauve-launcher.ini
font = Mononoki Nerd Font Mono:size=16

anchor = top-left
x-margin = 15
y-margin = 5
horizontal-pad = 20
lines = 8

placeholder = "Launch..."
prompt = " "

exit-on-keyboard-focus-loss = yes
terminal = ghostty -e

[border]
width = 2
radius = 4
