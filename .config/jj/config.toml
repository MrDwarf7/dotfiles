[templates]
op_log = "builtin_op_log_comfortable"

draft_commit_description = '''
   concat(
     coalesce(description, default_commit_description, "\n"),
     surround(
       "\nJJ: This commit has the following changed files:", "",
       "\nJJ:" ++ 
       "\n" ++
       indent("JJ:     ",
           diff.summary() ++
           diff.stat().total_added() ++ " | " ++ diff.stat().total_removed()
       ),
     ),
     "\n" ++
     "\nJJ: ignore-rest\n" ++
     "\n",
     diff.git(32)
   ) 
'''

duplicate_description = '''
   concat(
     description.trim_end(), " ",
     "(cherry: ", commit_id.short(), ")\n"
   )
 '''

[revset-aliases]
'wip()' = 'description(glob:"wip:*")'
'stash()' = 'description(glob:"stash:*")'
'blacklist()' = 'stash()'
'private()' = 'mutable() & (description(exact:"") | wip() | (empty() & ~merges())) | blacklist()'
'until(to)' = 'heads(::to & ~private())'
'until_bookmark(to)' = 'heads(::to & bookmarks())'
'branch(to)' = 'heads((::to | to::) & ~private())'
'branch_bookmark(to)' = 'heads((::to | to::) & bookmarks())'
'stack(to)' = 'ancestors(reachable(to, mutable() & ~blacklist()), 2)'
'user(x)' = 'author(x) | committer(x)'

[revsets]
logr = '(present(@) | ancestors(immutable_heads().., 4) | present(trunk())) & ~blacklist()'

