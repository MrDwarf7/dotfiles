# wallust v4 config
# https://explosion-mental.codeberg.page/wallust/

# How the image is parsed to get colors:
# full - resized - wal - thumb - fastresize - kmeans
backend = "fastresize"

# Color generation method:
# salience - ansi - kmeans
generation = "salience"

# Color palette scheme:
# dark - dark16 - harddark - harddark16 - darkcomp - darkcomp16
# light - light16 - softdark - softdark16 - lightcomp - lightcomp16
# softlight - softlight16 - softlightcomp - softlightcomp16
# palette = "harddarkcomp"
palette = "salience"

# Ensure readable contrast (disabled by default)
check_contrast = true

# Alpha value for templating (100 = fully opaque)
alpha = 60

[templates]
# CSS outputs
pallete = { template = '.palette.css', target = '~/.config/.palette.css', pywal = true }
waybar = { template = 'colors-waybar.css', target = '~/.config/waybar/style.css', pywal = true }
tofi = { template = 'colors-tofi', target = '~/.config/tofi/config', pywal = true }
wofi = { template = 'colors-wofi.css', target = '~/.config/wofi/style.css', pywal = true }
wlogout = { template = 'colors-wlogout.css', target = '~/.config/wlogout/style.css', pywal = true }
swaync = { template = 'colors-swaync.css', target = '~/.config/swaync/style.css', pywal = true }
# Hyprland Lua color module
hypr = { template = 'hypr-colors.lua', target = '~/.config/hypr/hypr-colors.lua', pywal = true }

# Hyprpaper (managed by wallust)
# NOTE: hyprpaper v0.8+ uses new wallpaper { } block syntax.
# The old wallpaper = , path format is no longer valid.
# Keep this commented out and use IPC or the new format manually if needed.
# hyprpaper.target = '~/.config/hypr/hyprpaper.conf'

# Ghostty
ghostty = { template = 'colors-ghostty.conf', target = '~/.config/ghostty/ghostty-colors.conf', pywal = true }
