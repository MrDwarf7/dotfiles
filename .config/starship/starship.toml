## #:-- schema https://starship.rs/config-schema.json
"$schema" = "https://starship.rs/config-schema.json"
# p10k_esq_starshi### Prompt


# The format layout for the prompt is as follows:

# [left side] [fill] [right prompt char] [right side] [right side endline] [newline] [space] [prompt char]

# Commands may be slower in restricted environments, e.g. containers
command_timeout = 10000
scan_timeout    = 1000


format = """$username\
$hostname\
$os\
$directory\
$jobs\
$vcs\
$fill\
$jj_status\
[ ](#767676)\
$cmd_duration\
$package\
$c\
$cmake\
$docker_context\
$golang\
$haskell\
$lua\
$meson\
$mojo\
$nim\
$nodejs\
$rust\
$terraform\
$typst\
$zig\
\n\
($sudo)$character"""


# $direnv\


#
#
# Setup-ish things
[fill]
disabled = false
symbol   = " "

[character]
disabled              = false
format                = "$symbol "
error_symbol          = " [❯](red)"
success_symbol        = " [❯](purple)"
vimcmd_replace_symbol = " [❯](orange)"
vimcmd_symbol         = " [❮](green)"
vimcmd_visual_symbol  = " [❯](yellow)"

[env_var.VIMSHELL]
disabled = false
format   = "[$env_value]($style)"
style    = 'green italic'

[sudo]
disabled = false
format   = " [$symbol]($style)"
style    = "bold italic bright-yellow"
symbol   = "⋈"
# symbol   = "⋈┈"

#
#
### Left prompt
[username]
disabled   = true
format     = "[ $user]($style)"
style_user = "#d3b987"

[hostname]
disabled = true
format   = "[@$hostname]($style)[](#767676)"
ssh_only = true
style    = "#d3b987"

[os]
disabled = false
format   = "[ $symbol]($style)"
style    = "#00afff"

[os.symbols]
