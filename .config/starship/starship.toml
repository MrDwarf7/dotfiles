"Hurd"             = "🐂 "
"Illumos"          = "🐦 "
"InstantOS"        = "⏲️ "
"Ios"              = "📱 "
"KDENeon"          = "⚛️ "
"Kali"             = "🐉 "
"Mabox"            = "📦 "
"Mariner"          = "🌊 "
"MidnightBSD"      = "🌘 "
"NetBSD"           = "🚩 "
"Nobara"           = "🎩 "
"OpenBSD"          = "🐡 "
"OpenCloudOS"      = "☁️ "
"OracleLinux"      = "🦴 "
"PikaOS"           = "🐤 "
"Pop"              = "🍭 "
"RedHatEnterprise" = "🎩 "
"Redhat"           = "🎩 "
"Redox"            = "🧪 "
"RockyLinux"       = "💠 "
"SUSE"             = "🦎 "
"Solus"            = "⛵ "
"Ultramarine"      = "🔷 "
"Unknown"          = "❓ "
"Uos"              = "🐲 "
"Zorin"            = "🔹 "
"openEuler"        = "🦉 "
"openSUSE"         = "🦎 "
# "CachyOS"          = "🎗️ "
# "CentOS"           = "💠 "
# "CoreOS"           = ""
# "Debian"           = "🌀 "
# "Fedora"           = "🎩 "
# "Gentoo"           = "🗜️ "
# "Macos"            = "🍎 "
# "Mint"             = "🌿 "
# "NixOS"            = "❄️ "
# "Raspbian"         = "🍓 "
# "Ubuntu"           = "🎯 "

[directory]
before_repo_root_style    = ""
disabled                  = false
fish_style_pwd_dir_length = 3
format                    = "[ $path]($style)[$read_only]($read_only_style) "
home_symbol               = "~"
read_only                 = "🔒"
read_only_style           = "red"
repo_root_format          = "[ $before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
repo_root_style           = "#0087af"
style                     = "#00afff"
truncate_to_repo          = true
truncation_length         = 0
truncation_symbol         = ""
use_os_path_sep           = true

# Non repo format
# Repo format
# read_only = " "
# truncate_to_repo = false

[direnv]
allowed_msg       = "allowed"
denied_msg        = "denied"
detect_env_vars   = [ "DIRENV_FILE" ]
detect_extensions = [  ]
detect_files      = [ ".envrc" ]
detect_folders    = [  ]
disabled          = false
format            = "[$symbol$loaded/$allowed]($style) "
loaded_msg        = "loaded"
not_allowed_msg   = "not allowed"
style             = "bold bright-yellow"
symbol            = "direnv "
unloaded_msg      = "unloaded"



[git_branch]
disabled = false
format   = "[ ](#767676)[$symbol$branch]($style)"
style    = "green"
symbol   = "  "


[git_status]
deleted   = "[-${count}](red) "
format    = " ([$stashed$modified$staged$untracked $ahead_behind]($style))"
modified  = "[!${count}](yellow) "
staged    = "[+${count}](green) "
stashed   = "[*${count}](blue) "
untracked = "[?${count}](blue)"
# format = " ([$all_status $ahead_behind]($style))"

#
#
### Right prompt info

#
#
## Generic/cmd stuff
[jobs]
disabled         = false
format           = "[$number]($style) "
number_threshold = 1
style            = "bold blue"
symbol           = "✦"
symbol_threshold = 1


[status]
disabled   = false
format     = "[$symbol$status]($style)"
map_symbol = false


[cmd_duration]
disabled = false
format   = "((#767676)[$duration  ]($style))"
style    = "#a8a8a8"


#
#
## Right prompt tools and versions

[c]
disabled = false
format   = "([$symbol($version(-$name)) ]($style))"
symbol   = " "

[cmake]
detect_files = [ "CMakeLists.txt", "CMakeCache.txt" ]
disabled     = false
format       = "([$symbol($version )]($style))"
symbol       = '△ '

[docker_context]
detect_files = [
  'docker-compose.yml',
  'docker-compose.yaml',
  'Dockerfile',
  '.dockerignore',
  'compose.yml',
  'compose.yaml',
]
disabled = false
format = "([$symbol$context]($style))"
symbol = " "

[dotnet]
detect_extensions = [ "csproj", "sln", 'fsproj', 'xproj', 'nuspec' ]
disabled          = false
format            = "([.NET $version ]($style))"
symbol            = '.NET '

[golang]
disabled = false
format   = "([$symbol($version )]($style))"
symbol   = " "

[haskell]
disabled = false
format   = "([$symbol($version )]($style))"
symbol   = 'λ '


[jj_bookmark]
disabled        = false
diverged_symbol = "⇕"
format          = "[ ](#767676)[$symbol$bookmark(@$remote)$diverged( \\(+$overflow_count others\\))]($style) "
# ignore_names      = [ "linux", "main", "master", "default" ]
ignore_names      = [  ]
ignore_remotes    = [ "origin" ]
style             = "green"
symbol            = " "
truncation_length = 65535
truncation_symbol = "…"
# style             = "green"
# diverged_symbol   = "*"


[jj_change]
change_hash_length = 7
commit_hash_length = 7
disabled           = false
# `$change` == [$change_prefix]($prefix_style)[$change_suffix]($suffix_style)([/$change_offset]($change_offset_style)) 
# `$commit` == [$commit_prefix]($prefix_style)[$commit_suffix]($suffix_style)
# format              = "([$change_prefix]($prefix_style)[$change_suffix]($suffix_style)([/$change_offset]($change_offset_style)) [$commit_prefix]($prefix_style)[$commit_suffix]($suffix_style)) "
format = "([$change_prefix]($prefix_style)[$change_suffix]($suffix_style)([/$change_offset]($change_offset_style)):[$commit_prefix](blue bold)[$commit_suffix]($suffix_style)) "
# format = "([$change_prefix]($prefix_style)[$change_suffix]($suffix_style)([/$change_offset]($change_offset_style)) [$commit_prefix](blue)) "
# format              = "([$change_prefix]($prefix_style)([/$change_offset]($change_offset_style)):[$commit_prefix](blue)) "
prefix_style        = "purple bold"
suffix_style        = "dimmed"
change_offset_style = "bold"
# format              = "$change "


[jj_metrics]
disabled      = false
added_style   = "dimmed green"
deleted_style = "dimmed red"
# format             = "([+$added]($added_style) )([-$deleted]($deleted_style) )"
format             = " ([$added]($added_style) )([$deleted]($deleted_style)) "
only_nonzero_diffs = true


[jj_status]
# `$all` == $conflicted$description$hidden$immutable$added$copied$deleted$modified$renamed
disabled = false
# format              = "([\\[$conflicted$description$hidden$immutable$added$copied$deleted$modified$renamed\\]]($style) )"
# format              = "([$conflicted$description$hidden$immutable$added$copied$deleted$modified$renamed]($style) )"
format              = "([$conflicted$description $hidden$immutable$added$copied$deleted$modified$renamed]($style) )"
conflicted          = "!"
description_empty   = "◌"
description_present = ""
hidden              = ""
immutable           = "◆"
added               = "+"
copied              = "="
deleted             = "x"
modified            = "~"
renamed             = "»$count"
style               = "dimmed"
# deleted             = "✘"



[lua]
disabled       = false
format         = "([$symbol($version )]($style))"
symbol         = "⨀ "
style          = "bold blue"
version_format = "${major}.${minor}.${patch}"
# version_format = "${raw}"


[meson]
disabled          = false
format            = "([$symbol$project]($style))"
style             = "blue bold"
symbol            = '⬢ '
truncation_length = 4294967295
truncation_symbol = "…"
# detect_files = [ 'meson.build', 'meson_options.txt' ]


[nim]
disabled = false
format   = "([$symbol($version )]($style))"
symbol   = "▴▲▴ "


[nix_shell]
disabled = false
format   = "[${symbol}nix ${state} ]($style)"
symbol   = " "


[nodejs]
disabled = false
format   = "([$symbol($version)]($style))"
symbol   = " "


[package]
disabled       = false
format         = "([$symbol($version )]($style))"
style          = "dimmed yellow italic"
symbol         = "◨ "
version_format = "${raw}"
# detect_folders = ["node_modules", "target"]
# detect_files = [ 
#     "package-lock.json",
#     "yarn.lock",
#     "cargo.lock",
#     "cargo.toml",
#     "Cargo.lock",
#     "Cargo.toml",
#     'go.mod',
#     'go.sum',
#     'go.work',
#     'glide.yaml',
#     'Gopkg.yml',
#     'Gopkg.lock',
#     '.go-version' 
# ]

[rust]
disabled       = false
format         = "([$symbol($version)]($style))"
symbol         = "🦀 "
version_format = "${major}.${minor}"
# format = '[ $symbol ($version )]($style)'
# symbol = "⊃ "


[vcs]
disabled    = false
git_modules = "$git_branch$git_commit$git_state$git_status"
# jj_modules  = "$jj_bookmark$jj_change$jj_metrics$jj_status"
jj_modules = "$jj_bookmark$jj_change$jj_metrics"
order      = [ "jj", "git" ]
# git_modules ="$git_branch$git_commit$git_state$git_metrics$git_status"
# order = [ "jj", "git", "hg", "pijul", "fossil" ]



# [python]
# disabled = true
# symbol = " "
# format = '([ ](#767676)[${symbol}${pyenv_prefix}(${version} )([\($virtualenv\)](#306998))]($style))'

[terraform]
disabled          = false
commands          = [ [ "terraform", "version" ], [ "tofu", "version" ] ]
detect_extensions = [ "tf", "tofu", "tfplan", "tfstate" ]
detect_files      = [ "terragrunt.hcl", "terraform.tf", "terraform.tfvars", "terraform.tfstate" ]
detect_folders    = [ ".terraform" ]
format            = "[$symbol$workspace]($style) "
style             = "bold 105"
symbol            = "💠 "
version_format    = "${major}.${minor}.${patch}"
# version_format    = "${raw}"


[typst]
detect_extensions = [ "typ", "typst" ]
detect_files      = [  ]
detect_folders    = [  ]
disabled          = false
format            = "[$symbol($version )]($style)"
style             = "bold #0093A7"
symbol            = "t "
version_format    = "${major}.${minor}.${patch}"
# version_format    = "${raw}"


[zig]
style          = "bold yellow"
detect_folders = [ ".zig-cache", "zig-out" ]
disabled       = false
format         = "([$symbol($version )]($style))"
symbol         = '↯ '
version_format = "${major}.${minor}.${patch}"


