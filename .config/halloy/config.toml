mark_as_read = "ctrl+shift+r"

cycle_next_buffer = "ctrl+tab"
cycle_previous_buffer = "ctrl+shift+tab"

cycle_next_unread_buffer = "ctrl+`"
cycle_previous_unread_buffer = "ctrl+shift+`"

scroll_up_page = "ctrl+up"
scroll_down_page = "ctrl+down"
scroll_to_top = "ctrl+home"
scroll_to_bottom = "ctrl+end"

