# Shared mise config (this file is the symlink target for ~/.config/mise).
# Machine/work extras: config.local.toml next to this file (gitignored).
# Do not put work-only tools here if you want one symlink on every box.

wrappers = { cargo = { command = "mbx", env = { MBX_CARGO_SHIM_MODE = "1" } } }

[tools]
uv = "latest"
python = "latest"

# JavaScript
node = "latest"

# Package Managers
# pnpm = "latest" ############### something broken
bun = "latest"

go = "latest"

# Tools
biome = "latest"
mr-boxington = "latest"

####################################################################################################

## NPM / Node.js / JavaScript/TypeScript Tools

golangci-lint = "latest"
air = "latest"           # Go live reload
prettier = "latest"
direnv = "latest"
"github:glennib/stakk" = "latest"

[tools."npm:typescript"]
version = "latest"


####################################################################################################

## Cargo / Cargo install / Cargo binstall / Rust / Rustup Tools

### Cargo / Rust package manager (pre-compiled binaries)
[tools."cargo-binstall"]
version = "latest"


### A Rust `check` or `clippy' runner companion that automatically re-runs linting commands in a TUI.
[tools."cargo:bacon"]
version = "latest"

[tools."cargo:cargo-cache"]
version = "latest"

[tools."cargo:cargo-feature"]
version = "latest"

[tools."cargo:cargo-generate"]
version = "latest"

[tools."cargo:cargo-llvm-cov"]
version = "latest"


### An extensive task runner and build tool for Rust projects. It allows you to define and run complex workflows, automate repetitive tasks, and manage dependencies. Installs as 'cargo-make' or 'cargo make'.
#### TODO: This is now available via the official repo's as: `extra/cargo-make`
[tools."cargo:cargo-make"]
version = "latest"

[tools."cargo:cargo-nextest"]
version = "latest"

### A markdown viewer key'd specifically to how GitHub renders markdown. Installs as 'mdv'.
[tools."cargo:mdv"]
version = "latest"

[tools."cargo:cargo-outdated"]
version = "latest"

[tools."cargo:cargo-udeps"]
version = "latest"

# stand in for cargo-install-update* (which is what native cargo --install or cargo binstall would use)
[tools."cargo:cargo-update"]
version = "latest"

### Allows running cargo watch to automatically recompile and rerun your Rust code when changes are detected. Installs as 'cargo-watch'.
[tools."cargo:cargo-watch"]
version = "latest"

[tools."cargo:cargo-workspaces"]
version = "latest"

# [tools."cargo:cargo-zigbuild"]
# version = "latest"

### The Tauri CLI is a command line interface for building and bundling Tauri apps. It is used to create new Tauri projects, build and bundle existing projects, and run Tauri apps in development mode. Installs as 'tauri'.
[tools."cargo:create-tauri-app"]
version = "latest"


### Performance profiling and flamegraph generation for Rust programs. Installs as 'flamegraph'.
[tools."cargo:flamegraph"]
version = "latest"


### JJ / Jujutsu workspace (worktree) manageer and helper tool.
[tools."cargo:jj-navi"]
version = "latest"

#####

### A simple, fast, and flexible command-line tool for managing and running tasks (written in Rust). Installs as 'just'.
[tools.just]
version = "latest"


####################################################################################################

[settings]
experimental = true
idiomatic_version_file_enable_tools = []

cargo.binstall = true              # Prefer using binstall over cargo --install
cargo.binstall_quickinstall = true # Allows cargo binstall to fallback to cargo-quickinstall before trying normal `cargo install` cmds ( docs: https://mise.jdx.dev/dev-tools/backends/cargo.html#cargo.binstall_quickinstall | repo: https://github.com/cargo-bins/cargo-quickinstall )

npm.bun = true # Prefer using bun over npm

pipx.uvx = true # Prefer to use ux(x) mode instead of pipx

# Experimental 'dotfiles' manager stuff
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink" # "symlink" | "symlink-each" | "copy" | "template"

[dotfiles]
