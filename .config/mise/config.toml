####################################################################################################

[settings]
experimental = true
idiomatic_version_file_enable_tools = []

cargo.binstall = true # Prefer using binstall over cargo --install
npm.bun = true        # Prefer using bun over npm

# npm.package_manager = "bun"

pipx.uvx = true # Prefer to use ux(x) mode instead of pipx
# pipx_uvx = true # Prefer to use ux(x) mode instead of pipx

python.uv_venv_auto = "create|source" # Auto-source (create if missing) .venv when a uv.lock is present

# Experimental 'dotfiles' manager stuff
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink" # "symlink" | "symlink-each" | "copy" | "template"

[dotfiles]
