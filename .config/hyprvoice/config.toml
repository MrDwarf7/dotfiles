# Hyprvoice Configuration
# Generated by hyprvoice onboarding or configure
# Changes are applied immediately without daemon restart.

# Run after changes to ensure they're applied
# systemctl --user restart hyprvoice.service

# Keywords help transcription and LLM spell names/terms correctly
keywords = [
  "neovim",
  "Hyprland",
  "hyprland",
  "hyprvoice",
  "cool",
  "LLM",
  "LLM's",
  "Vivaldi",
  "symlink",
]

# Audio Recording Configuration
[recording]
sample_rate = 16000
channels = 1
format = "s16"
buffer_size = 8192
device = ""
channel_buffer_size = 30
timeout = "5m0s"


# Speech Transcription Configuration
[transcription]
provider = "whisper-cpp"
language = "en"
model = "large-v3-turbo"
streaming = false
threads = 7

# LLM Post-Processing Configuration
[llm]
enabled = false

[llm.post_processing]
remove_stutters = true
add_punctuation = true
fix_grammar = true
remove_filler_words = true

[llm.custom_prompt]
enabled = false

# Text Injection Configuration
[injection]
backends = ["wtype", "clipboard", "ydotool"]
ydotool_timeout = "5s"
wtype_timeout = "5s"
clipboard_timeout = "3s"

# Desktop Notification Configuration
[notifications]
enabled = true
type = "desktop"
