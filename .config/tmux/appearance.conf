# vim:set ft=tmux: sw=2 ts=2 sts=2 et:
## DESIGN TWEAKS

# - #I == Number of tab
# - #W == What's running in it
# - #F == special icon for current and previous tabs
#
# The below 2 both work more or less identically
#
# - #{b:pane_current_path} == The full cwd, but truncated to fit the status bar (note the 'b:' prefix, which stands for 'buffered' and allows for truncation)
# - #(pwd="#{pane_current_path}"; echo ${pwd####*/}) == The cwd, but stripped back (note the 4x '#', escaping the escape etc.)
# *Note that what would be ${pwd##*/} is escaped to ${pwd####*/} since # has special meaning in the format string.
#
# eg in use: 
# setw -g window-status-format '#[fg=white]#I|#[fg=#{@color-secondary}]#W #[fg=white]#(pwd="#{pane_current_path}"; echo ${pwd####*/}) #[fg=#{@color-accent}]#F' # Inactive

# This... monstrosity, it converts your home dir -> ~
# - #(c="#{b:pane_current_path}"; [[ "$c" == "$USER" ]]; echo "~" && [[ "$c" != "$USER" ]] && echo "$c";)

# This one handles converting the shell name -> '$'
# - #(w="#W"; [[ "$w" == "${SHELL}" ]]; echo "$" && [[ "$w" != "${SHELL}" ]] && echo "$w";)

# Same as above, but we don't need the $ at all, just don't display it
# - #(w="#W"; [[ "$w" != "${SHELL}" ]] && echo "$w";)

# https://unix.stackexchange.com/questions/564618/set-tmux-pane-title-to-user-defined-if-exists-else-current-working-file-or-dire

# Turnary (using tmux's DSL)
## - #{?pane_title,#{pane_title},#{pane_current_command}}
#
# tmux set -g pane-border-format "#{pane_index} #{?#{!=:#{pane_title},$(hostname)},#{pane_title},#{pane_current_path}}"

source-file -q "$XDG_CONFIG_HOME/tmux/vars.conf"

set -g status-position top

set -g window-status-current-style "bg=#{@color-primary},fg=#{@color-text},bold"

## {NUM}|{RUN} {CWD} {ICON}
# setw -g window-status-current-format ' #I|#W #{b:pane_current_path} #F ' # Active

## ' {NUM}|{RUN}@{CWD}{ICON} '
setw -g window-status-current-format ' #I//#(c="#{b:pane_current_path}"; [[ "$c" == "$USER" ]]; echo "~" && [[ "$c" != "$USER" ]] && echo "$c";) #(w="#W"; [[ "$w" != "${SHELL}" ]] && echo "$w";)#F |' # Active
set -g window-status-style "bg=0,fg=white"


# Where G is grey, and W is White in this case
#          G     W
## '{NUM}|{RUN} {CWD} {ICON}'
# setw -g window-status-format '#[fg=white]#I|#[fg=#{@color-secondary}]#W #[fg=white]#{b:pane_current_path}#[fg=#{@color-accent}]#F ' # Inactive
# setw -g window-status-format '#[fg=#{@color-accent}]#I|#[fg=#{@color-secondary}]#W #[fg=white]#{b:pane_current_path}/#[fg=#{@color-accent}]#F #[fg=white]|' # Inactive

#          W     G
## {NUM}|{RUN}@{CWD}{ICON}
# setw -g window-status-format '#I│#W@#[fg=#{@color-secondary}]#{b:pane_current_path}#[fg=#{@color-accent}]#F' # Inactive
# setw -g window-status-format '#I #W#[fg=#{@color-secondary}]@#{b:pane_current_path}#[fg=#{@color-accent}]#F#[fg=white] │' # Inactive
setw -g window-status-format '#I#[fg=#{@color-accent}]//#[fg=white]#(c="#{b:pane_current_path}"; [[ "$c" == "$USER" ]]; echo "~" && [[ "$c" != "$USER" ]] && echo "$c";) #[fg=#{@color-secondary}]#(w="#W"; [[ "$w" != "${SHELL}" ]] && echo "$w";)#[fg=#{@color-accent}]#F#[fg=white] │' # Inactive

## '{NUM}|{CWD} {RUN} {ICON}'
# setw -g window-status-format '#[fg=white]#I|#{b:pane_current_path} #[fg=#{@color-secondary}]#W #[fg=#{@color-accent}]#F' # Inactive

set -g pane-active-border-style 'fg=#{@color-primary},bg=default' # active
set -g pane-border-style 'fg=#{@color-secondary},bg=default' # inactive

# setw -g pane-border-format ' #{=/-20/…:pane_title} [#{=/-20/…:pane_current_command}] #(pgrep -P "#{pane_pid}" | tr "\n" " ")#{pane_current_path} #{?alternate_on,<Alt Mode> ,}'

set -g status-style 'bg=#{@color-text},fg=#{@color-primary}'
set -g status-left ""

# %I:%M %Y-%m-%d
#
# %I - 12^ hour format
# %M - minutes
# %Y - year
# %m - numbered month (with leading zero)
# %d - day of month
#
# set -g status-right " #[fg=#{@color-primary}]#H #[fg=white]| #S #[fg=#{@color-secondary}]| #[fg=#{@color-accent}]%I:%M #[fg=#{@color-secondary}]%Y-%m-%d "
set -g status-right " #[fg=#{@color-primary}]#H #[fg=white]| #S #[fg=#{@color-secondary}]| "

set -g message-style 'bg=#{@color-text},fg=white'


# # be sure to see note* below
# set -g window-status-format '#I:#(pwd="#{pane_current_path}"; echo ${pwd####*/})#F'
# set -g window-status-current-format '#I:#(pwd="#{pane_current_path}"; echo ${pwd####*/})#F'
#
# # status bar updates every 15s by default**, change to 1s here 
# # (this step is optional - a lower latency might have negative battery/cpu usage impacts)
# set -g status-interval 1
# *Note that what would be ${pwd##*/} is escaped to ${pwd####*/} since # has special meaning in the format string.
