# vim:set ft=tmux: sw=2 ts=2 sts=2 et:

### PULL UP THE KEYS VIA 
# Ctrl+a + ?

###############
## Variables ##
###############

source-file -q "$XDG_CONFIG_HOME/tmux/vars.conf"


############
## Basics ##
############

set-option -g allow-rename on     # automatic window renaming
set -g escape-time 0              # We don't use escape inside of key sequences lol... It's for clearing things eh?
set -g mouse on                   # Mouse is useable
set -s set-clipboard on
set -s copy-command "#{@copy-program}"
set -g history-limit 1000000      # increase history size (from 2,000)
setw -g mode-keys vi
setw -g aggressive-resize on      # Normally windows are contained to smallest size of panes, this makes them resize to fill the entire window
setw -g monitor-activity off
set -g renumber-windows on        # Allow renumbering of windows when one is closed
set -g base-index 1               # Start numbering at 1
# set -g detach-on-destroy off    # don't exit from tmux when closing a session
set -g display-time 1500          # Increase tmux messages display duration from 750ms
set -g default-terminal "${TERM}"
set -a terminal-features "tmux-256color:RGB"
# set-option -g default-terminal "${TERM}-256olor"
## don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
set -g bell-action none
setw -g clock-mode-colour blue    # clock mode font color
set -g clock-mode-style 12        # whether you want a 12 or 24 hour clock


#############
## Plugins ##
#############

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

###########
## Binds ##
###########

source-file -q "$XDG_CONFIG_HOME/tmux/binds.conf"


################
## Appearance ##
################

source-file -q "$XDG_CONFIG_HOME/tmux/appearance.conf"


################
## Source TPM ##
################
#
run "$XDG_CONFIG_HOME/tmux/plugins/tpm/tpm"
