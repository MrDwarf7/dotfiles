# vim:set ft=tmux: sw=2 ts=2 sts=2 et:


############
## Basics ##
############

unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix


# Below are a bunch of unbinds and their previous commands

# Swap these 2
unbind-key D # detach-client
unbind-key d # kill-pane

unbind-key P # Previusly 'pane-border-status'
unbind-key '"' # Prevously split horizontal
unbind-key % # Prevously split vertical
unbind-key "'" # 'last-window'
unbind-key $

# Unbind default bindings for prefix , and prefix .
unbind-key ,  # was 'rename-window' (+ filling in the existing name of it)
unbind-key .  # move-window

# set-option -g prefix C-b
# bind-key C-b send-prefix


# reload config file (change file location to your the tmux.conf you want to use)
bind R source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "Reloaded!"
bind r command-prompt "rename-window %%"

bind d kill-pane
bind D detach-client

bind C-p previous-window          # We double up so that (Ctrl-a + Ctrl-p) is same as ctrl-a + p
bind C-n next-window              # same here

bind -r C-p previous-window          # We double up so that (Ctrl-a + Ctrl-p) is same as ctrl-a + p
bind -r C-n next-window              # same here

bind N select-window -t ':+2' # We need a way to say 'the _LAST_ window in N-1 number of winodws
bind P select-window -t ':-2' # We need a way to say 'the _LAST_ window in N-1 number of winodws

bind g set pane-border-status # Sort of a 'mini-status' of what the pane is doing
bind B set -g status # To toggle the bar off and on


# split panes using | and -
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# bind "`" last-window # Tapping ctrl-a + backtick will pop you between the last two used windows
bind C-a last-window # Tapping ctrl-a + a will pop you between the last two used windows
bind a last-window


# TODO: 
# last window of the line
#


## Custom bind for - windows/tabs to spawn in $HOME, not the directory in which tmux was launched
bind ^C new-window -c "$HOME"
bind c new-window -c "#{pane_current_path}" # not entirely needed, but forces

bind y copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe
# -and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi C-q send-keys -X rectangle-toggle
bind-key -T copy-mode-vi H send-keys ^
bind-key -T copy-mode-vi L send-keys $
# bind-key -T copy-mode-vi Escape send-keys -X ####### how to do like, double-escape? maybe just 'copy-pipe' ?


##############################
## Extra stuff and fiddling ##
##############################

# bind "'" select-pane -t :.+ # Cycle through panes
bind "'" switch-client -t '{marked}'

## Treating the list of windows kinda like a neovim line, we want to use 'Enter' as an equiv. to `$` here
# bind "Enter" switch-client -t ':+2' # We need a way to say 'the _LAST_ window in N-1 number of winodws
bind "Enter" select-window -t '{end}'
bind $ select-window -t '{end}'
bind ^ select-window -t '{start}'

# C-a, ! -- is to breakout a pane (Will also move it to the end if there's only one pane)
# C-a, C-o -- rotate window/panes
# C-a, space -- rotate layouts

# join veritcally (from some other window/tab)
bind _ choose-window 'join-pane -s "%%"'
# join horizontally (from some other window/tab)
bind | choose-window 'join-pane -h -s "%%"'


bind-key x kill-pane # Skip the confirmation dialog thing

# Getting around panes (Same as wezterm)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

## Allows swapping panels quickls via 1 usage of C-a, and holding C (crtl) and pressing a direction.
# Must be done within the timeout period, or it will reset (require another prefix to jump again)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

bind -r -T root C-Left resize-pane -L 8
bind -r -T root C-Right resize-pane -R 8
bind -r -T root C-Down resize-pane -D 4
bind -r -T root C-Up resize-pane -U 4


bind -r , swap-window -d -t -1
bind -r . swap-window -d -t +1

# List sessions based on last used time
# tmux choose-tree -Zs
# -Z[type] -> Zooms pane (takes up whole screen vs. only that pane)
# -s -> start with sessions collapsed,
# -w -> windows collapsed
# -O[how] -> 'index' | 'name' | 'time'
# bind -r s choose-tree -O 'time' -Zs
# bind -r s choose-tree -O 'index' -Zs
bind -r s choose-session -O 'index' -Z
# 's' was originally this (swapped them)
# bind -r S choose-tree -Zs
# bind -n M-W command-prompt "rename-session '%%'"

# bind -r s choose-session

bind-key u run-shell -b "tmux-url-select"
bind-key o run-shell -b "tmux-popup"

bind -r S command-prompt "rename-session '%%'"

