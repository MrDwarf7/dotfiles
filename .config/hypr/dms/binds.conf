#########################
$hyprdir = $HOME/.config/hypr
$keymaps_dir = $hyprdir/configs/keymaps
source = $hyprdir/configs/programs.conf
source = $keymaps_dir/02_map_mods.conf
#########################

# === Application Launchers ===
# Tofi is so much faster
bind = $mainMod, R, exec, $menu

bind = $mainModShift, R, exec, dms ipc call spotlight toggle
bind = $mainModShift, V, exec, dms ipc call clipboard toggle
# bind = $mainMod, M, exec, dms ipc call processlist focusOrToggle
bind = $mainMod, comma, exec, dms ipc call settings focusOrToggle
bind = $mainModCtrl, A, exec, dms ipc call notifications toggle

bind = $mainModShift, A, exec, dms ipc call notepad toggle

bind = $mainMod, Y, exec, dms ipc call dankdash wallpaper
# bind = $mainMod, TAB, exec, dms ipc call hypr toggleOverview
bind = $mainMod, M, exec, dms ipc call powermenu toggle
bind = $mainMod, X, exec, dms ipc dash toggle overview
bind = $mainMod, S, exec, dms ipc control-center toggle
bind = $mainMod, N, exec, dms ipc notepad toggle
# bind = $mainMod, C, exec, dms ipc control-center toggle overview


# === Cheat sheet
# bind = $mainMod SHIFT, Slash, exec, dms ipc call keybinds toggle hyprland

# === Security ===
bind = $mainMod, U, exec, dms ipc call lock lock
# bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle


# === Screenshots ===
bind = $mainModCtrl, S, exec, dms screenshot
# bind = CTRL, Print, exec, dms screenshot full
# bind = ALT, Print, exec, dms screenshot window

# === System Controls ===
bind = $mainModShift, P, dpms, toggle

# === Audio Controls ===
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = , XF86AudioMicMute, exec, dms ipc call audio micmute
bindl = , XF86AudioPause, exec, dms ipc call mpris playPause
bindl = , XF86AudioPlay, exec, dms ipc call mpris playPause
bindl = , XF86AudioPrev, exec, dms ipc call mpris previous
bindl = , XF86AudioNext, exec, dms ipc call mpris next
bindel = CTRL, XF86AudioRaiseVolume, exec, dms ipc call mpris increment 3
bindel = CTRL, XF86AudioLowerVolume, exec, dms ipc call mpris decrement 3

# === Brightness Controls ===
bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

# === Window Management ===
# bind = $mainMod SHIFT, W, exec, dms ipc call window-rules toggle

# === Workspace Management ===
# bind = $mainMod CTRL, R, exec, dms ipc call workspace-rename open


##### from orignal config(s)


## map_general.conf

bind = $mainMod, q, killactive,
bind = $mainMod, q, focusmonitor, 0

#### IMPORTANT END ####


bind = $mainMod, f, togglefloating,
bind = $mainMod, c, centerwindow,

bind = $mainMod, p, pin 

# groups
bind = $mainModShift, g, lockgroups, toggle
bind = $mainMod, g, togglegroup

bind = $mainMod, Home, changegroupactive, b
bind = $mainMod, End, changegroupactive, f

bind = $mainMod, z, pseudo # dwindle || maintains the 'space' for a 'floated' window
bind = $mainMod, Space, togglesplit # dwindle
bind = $mainModShift, f, fullscreen, 1
## Allow swapping when using 'master' layout method
bind = $mainModCtrl, f, layoutmsg, swapwithmaster master

bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop    # bring it to the top




## map_programs.conf

bind = $mainMod, t, exec, $term
bind = $mainModShift, t, exec, $second_term
bind = $mainModAlt, t, exec, kitty # Mostly a safety measure lol
bind = $mainMod, b, exec, $browser
bind = $mainMod, e, exec, $fileManager
bind = $mainModShift, c, exec, $color_picker


## map_misc.conf

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow




## map_windows_workspaces.conf

##############################
### WINDOWS AND WORKSPACES ###
##############################

#### Arrows used for workspace stuff ####
#### Letters used for in the current viewport/workspace ####

# Move current focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# I hot these way too often not to just bind them honestly
# bind = $mainMod, y, movefocus, l
# bind = $mainMod, o, movefocus, r


#######################
### shift_win_binds ###
#######################

# Move it around on the current screen
bind = $mainModShift, h, movewindow, l
bind = $mainModShift, j, movewindow, d
bind = $mainModShift, k, movewindow, u
bind = $mainModShift, l, movewindow, r

# Swapping between worskapces - same behaviour as eg: pressing same workspace number again
bind = $mainMod, w, workspace, previous
bind = $mainMod, Tab, workspace, previous
# bind = $mainModShift, Tab, workspace, previous ### idk wtf this is doing lmao

###########################
### shift_win_binds END ###
###########################





########################
### resize_win_binds ###
########################

binde = $mainModCtrl, h, resizeactive, -50 0
binde = $mainModCtrl, j, resizeactive, 0 50
binde = $mainModCtrl, k, resizeactive, 0 -50
binde = $mainModCtrl, l, resizeactive, 50 0

binde = $mainModCtrl, left, resizeactive, -50 0
binde = $mainModCtrl, down, resizeactive, 0 50
binde = $mainModCtrl, up, resizeactive, 0 -50
binde = $mainModCtrl, right, resizeactive, 50 0

############################
### resize_win_binds END ###
############################





#######################
### workspace_binds ###
#######################

## Move view to a workspace
# inners are swapped technically - each forms a pair
bind = $mainMod, left, workspace, e-1
bind = $mainMod, down, workspace, e+1

bind = $mainMod, up, workspace, e-1
bind = $mainMod, right, workspace, e+1

# Absolute
## Move view to a workspace - number keys
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

###########################
### workspace_binds END ###
###########################



###############################
### move_to_workspace_binds ###
###############################

# Relative
## Move window to workspace
bind = $mainModShift, left, movetoworkspace, e-1
bind = $mainModShift, down, movetoworkspace, e-1
bind = $mainModShift, up, movetoworkspace, e+1
bind = $mainModShift, right, movetoworkspace, e+1

bind = $mainMod, mouse_down, workspace, e-1
bind = $mainMod, mouse_up, workspace, e+1

# Absolute - number keys
bind = $mainModShift, 1, movetoworkspace, 1
bind = $mainModShift, 2, movetoworkspace, 2
bind = $mainModShift, 3, movetoworkspace, 3
bind = $mainModShift, 4, movetoworkspace, 4
bind = $mainModShift, 5, movetoworkspace, 5
bind = $mainModShift, 6, movetoworkspace, 6
bind = $mainModShift, 7, movetoworkspace, 7
bind = $mainModShift, 8, movetoworkspace, 8
bind = $mainModShift, 9, movetoworkspace, 9
bind = $mainModShift, 0, movetoworkspace, 10

bind = $mainMod, Tab, workspace, next,
bind = $mainModShift, Tab, workspace, previous

###################################
### move_to_workspace_binds END ###
###################################

