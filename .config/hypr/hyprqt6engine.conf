theme {
    color_scheme_path = /usr/share/qt6ct/colors/darker.conf
    icon_theme = TokyoNight-SE
    style = Fusion

    # Default is: monospace
    font_fixed = FiraCode Nerd Font Mono
    # Default is: 11
    font_fixed_size = 11

    # Default is: Sans Serif
    font = FiraCode Nerd Font Mono
    # Default is: 11
    font_size = 11
}

misc {
    # Default is: true
    single_click_activate = true
    # Default is: true
    menus_have_icons = true
    # Default is: true
    shortcuts_for_context_menus = true
}
