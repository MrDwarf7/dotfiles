#########################

# Workspace pinning
#
## Primary monitor 
# 1 - Browser 
# 2 - Gen_
# 3 - (GUI) Editor 
# 4
# 5
# 6
# 7 - Voice
# 8  - Referene Notes / Obsidian etc.
#
## Secondary monitor
# 9 - Music / Voice
windowrule = workspace 1,class:^(zen(-browser)?)$
windowrule = opacity 1.0 override 1.0 override,class:^(zen(-browser)?)$
windowrule = pseudo,class:^(zen(-browser)?)$
windowrule = size 2660 1300,class:^(zen(-browser)?)$,
windowrule = noinitialfocus,class:^(zen(-browser)?)$, # allows spawning it via mod + b, without swapping

windowrule = float,class:^(zen.*)$,title:^(Picture-in-Picture)$


# windowrule = opacity 1.0 override 1.0 override,class:^([cC]hromium)$
windowrule = pseudo,class:^([cC]hromium)$
windowrule = size 2660 1300,class:^([cC]hromium)$,
windowrule = persistentsize,class:^([cC]hromium)$, # allows spawning it via mod + b, without swapping
# windowrule = noinitialfocus,class:^([cC]hromium)$, # allows spawning it via mod + b, without swapping


# windowrule = opacity 1.00,class:^(zed-editor)$
# Zed / zed editor
windowrule = workspace 3,class:^(dev.[zZ]ed\.?[zZ]ed)$
windowrule = persistentsize,class:^(dev.[zZ]ed\.?[zZ]ed)$
# windowrule = float,class:^(dev.[zZ]ed\.?[zZ]ed)$
windowrule = pseudo,class:^(dev.[zZ]ed\.?[zZ]ed)$
windowrule = size 2950 1350,class:^(dev.[zZ]ed\.?[zZ]ed)$
windowrule = opacity 1.0 override 1.0 override,class:^(dev.[zZ]ed\.?[zZ]ed)$


# TODO: There is the dispatch that can 
# 'create' / 'do' something on first entry to a workspace (workspace 2 in my case?)
