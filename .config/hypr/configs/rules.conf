windowrule = pseudo,class:^(org\.wezfurlong\.wezterm)$
windowrule = center,class:^(org\.wezfurlong\.wezterm)$,
windowrule = size 2280 1000,class:^(org\.wezfurlong\.wezterm)$,
# windowrule = size 2200 1000,class:^(org\.wezfurlong\.wezterm)$,
# windowrule = size 1760 850,class:^(org\.wezfurlong\.wezterm)$,

