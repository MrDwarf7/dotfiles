# Opacity handling

windowrule = float,class:^(org.pulseaudio.pavucontrol)$ # Make the volume mixer always float
windowrule = size 1000 650,class:^(org.pulseaudio.pavucontrol)$

windowrule = float,title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = size 960 540,title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = move 25%-,title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$

windowrule = float,class:^(io.github.Qalculate.qalculate-qt)$
windowrule = size 600 900,class:^(io.github.Qalculate.qalculate-qt)$

windowrule = float,class:^(qt5ct)$
windowrule = size 960 540,class:^(qt5ct)$
windowrule = float,class:^(qt6ct)$
windowrule = size 960 540,class:^(qt6ct)$

