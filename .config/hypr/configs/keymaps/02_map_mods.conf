#########################
$hyprdir = $HOME/.config/hypr
$keymaps_dir = $hyprdir/configs/keymaps
source = $hyprdir/configs/programs.conf
#########################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$mainModShift = "{$mainMod} SHIFT";
$mainModCtrl = "{$mainMod} CTRL";
$mainModAlt = "{$mainMod} ALT";

## TODO: Work out a FUNCTIONAL mapping, cos 90% of misc. keys don't even work???
$submapMod=$mainModAlt
