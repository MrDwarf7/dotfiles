windowrule {
  name = workspace-telegram-qq
  match:class = ^(QQ|Telegram|org.telegram.desktop)$
  match:title = ^(QQ|Telegram)$
  opacity = 1.0 override 1.0 override
  workspace = 6 silent
  center = true
  persistent_size = true
}

