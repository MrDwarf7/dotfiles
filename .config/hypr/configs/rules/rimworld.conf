# Tagging
windowrule {
  name = tag-rimworld
  match:class = ^([rR]im[wW]orld[lL]inux)$
  # match:initial_title = ^([rR]im[wW]orld.*)$
  tag = +rimworld
}

# Effects

## Generic opacity for tagged things
windowrule {
  name = tagged-rimworld-generic
  match:tag = rimworld 
  opacity = 1.0 override 1.0 override
  persistent_size = true
  border_size = 0
}

## Float things
windowrule {
  name = float-tagged-rimworld
  match:tag = rimworld 
  size = 5120 1440
  fullscreen = true
  # maximize = true
  # content = game
  # float = true
  # center = true
}

