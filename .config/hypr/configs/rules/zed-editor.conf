windowrule {
  name = tag-zed-editor
  match:class = ^(dev.[zZ]ed\.?[zZ]ed)$
  tag = +zedEditor
}

windowrule {
  name = workspace-zed-editor
  workspace = 3 silent
  no_initial_focus = true
}

windowrule {
  name = pseudo-zed-editor
  match:tag = zedEditor
  pseudo = true
  persistent_size = true
  size = 2950 1350
  opacity = 1.0 override 1.0 override
}

