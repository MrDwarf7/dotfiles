windowrule {
  name = tag-ytm
  match:class = ^com.github.th_ch.youtube.+$
  tag = +ytm
}

windowrule {
  name = workspace-ytm
  match:tag = ytm
  workspace = 9 silent
}

windowrule {
  name = float-ytm
  match:tag = ytm
  # float = true
  center = true
  size = 1250 850
  persistent_size = true
}

