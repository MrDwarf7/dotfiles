windowrule {
  name = float-keepass
  match:class = ^(org.keepassxc.KeePassXC)$
  float = true
  center = true
  size = 1450 1000
}


windowrule {
  name = focus-keepass
  match:class = ^(org.keepassxc.KeePassXC)$
	# initialTitle: Unlock Database - KeePassXC
  match:initial_title = ^(Unlock Database - KeePassXC)$
  focus_on_activate = true
  # no_initial_focus = false
}



