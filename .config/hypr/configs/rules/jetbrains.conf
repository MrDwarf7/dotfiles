windowrule {
  name = jb-toolbox-menus-fix
  match:class = ^(.*jetbrains.*)$
  match:title = ^(win.*)$
  # match:tag = jb
  no_initial_focus = true
  no_focus = true
}

windowrule {
  name = jb-tab-dragging-fix
  match:class = ^(.*jetbrains.*)$
  match:title = ^\\s$
  # match:tag = jb
  no_initial_focus = true
  no_focus = true
}

windowrule {
  name = jb-tab-dragging-fix-2
  match:class = ^(jetbrains-.+)$
  match:tag = jb
  match:float = 1
  stay_focused = true
  no_initial_focus = true
}

