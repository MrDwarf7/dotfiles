## Jetbrains / Idea / IntelliJ / PyCharm / WebStorm / GoLand / RubyMine etc

# Tagging
windowrule {
  name = tag-jb
  match:class = ^(jetbrains-.+)$
  tag = +jb
}

windowrule {
  name = workspace-jb
  match:tag = jb
  workspace = 3 silent
}

