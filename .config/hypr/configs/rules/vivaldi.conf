######### main window
windowrule = tag +vbrowserInitTitle,title:^[vV]ivaldi(-?[vV]ivaldi)?$
windowrule = tag +vbrowserInitClass,class:^[vV]ivaldi(-?[vV]ivaldi)?$

windowrule = workspace 1,tag:vbrowserInitClass,tag:vbrowserInitTitle
windowrule = opacity 1.0 override 1.0 override,tag:vbrowserInitClass,tag:vbrowserInitTitle
windowrule = noinitialfocus,tag:vbrowserInitClass,initial-title:vbrowserInitClass
windowrule = opaque, tag:vbrowserInitClass

## Settings window 
#
# at: 1989,288
# size: 1141,864
# class: vivaldi-stable
# title: Vivaldi Settings: General - Vivaldi
# initialClass: vivaldi-stable
# initialTitle: Vivaldi Settings: General - Vivaldi

######### settings floating window
windowrule = tag +vSettingsInitTitle,title:^[vV]ivaldi Settings\:(.*)(-?[vV]ivaldi)?$

windowrule = pseudo,tag:vSettingsInitTitle
windowrule = center, float, size 1200 1100,tag:vSettingsInitTitle
windowrule = persistentsize,tag:vSettingsInitTitle
windowrule = opaque,tag:vSettingsInitTitle
windowrule = opacity 1.0 override 1.0 override,tag:vSettingsInitTitle


######### web app window(s) spawned outside of vivaldi
windowrule = tag +vwebapp,class:^([vV]ivaldi).*(-?[dD]efault)$
windowrule = pseudo,tag:vwebapp
windowrule = float,tag:vwebapp
windowrule = persistentsize,tag:vwebapp
windowrule = opaque,tag:vwebapp
