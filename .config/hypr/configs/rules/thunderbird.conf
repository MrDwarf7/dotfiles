# class: org.mozilla.Thunderbird
# title: Write: (no subject) - Thunderbird
# initialClass: org.mozilla.Thunderbird
# initialTitle: Write: (no subject)

# Tagging
windowrule {
  name = tag-thunderbird
  match:class = ^(org.mozilla.Thunderbird)$
  # match:initial_class = ^(STUFF)$ 
  match:title = ^(Write:\s.*)$
  # match:initial_title = ^(MORE_STUFF)$
  tag = +thunderbird-write
}

# Effects

## Generic opacity for tagged things
windowrule {
  name = tagged-thunderbird-write
  match:tag = thunderbird-write
  opacity = 1.0 override 1.0 override
  persistent_size = true
}

## Float things
windowrule {
  name = float-tagged-thunderbird-write
  match:tag = thunderbird-write
  # workspace = N silent
  float = true
  center = true
  size = 1600 900
}

