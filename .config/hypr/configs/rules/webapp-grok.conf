# vivaldi / web app / webapp / default

windowrule {
  name = tag-vivaldi-webapp-grok
  # match:class = ^([vV]ivaldi-?)(.*)(-+)(-?[dD]efault)$
  match:class = ^([vV]ivaldi)(-)(.*)(-)([dD]efault)$
  match:initial_class = ^([vV]ivaldi)(-)(.*)(-)([dD]efault)$
  match:title = ^([gG]rok)$
  match:initial_title = ^([gG]rok)$
  tag = +vwebapp-grok
}

windowrule {
  name = vivaldi-webapp-grok
  match:tag = vwebapp-grok
  size = 1000 1300
  move = 20 95
  pseudo = true
  float = false
  persistent_size = true
  # opaque = vwebapp-grok
  # opacity = 1.0 override 1.0 override
}

