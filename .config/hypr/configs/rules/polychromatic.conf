windowrule {
  name = tag-polychromatic
  match:class = ^(polychromatic)$
  tag = +polychromatic
}

windowrule {
  name = float-tagged-polychromatic
  match:tag = polychromatic
  float = true
  center = true
  size = 1050 950
}

windowrule {
  name = size-polychromatic-device-info
  match:class = ^(polychromatic)$
  match:title = ^(Device Information - .+)$
  size = 200 400
}

