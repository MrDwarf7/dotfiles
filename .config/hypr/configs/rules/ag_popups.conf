windowrule {
  name = float-file-dialogs
  match:class = ^()$
  match:title = ^(Save File|Open File)$
  float = true
}

windowrule {
  name = float-xdg-desktop-portals
  match:class = ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
  float = true
}


windowrule {
  name = float-polkit-agents
  match:class = ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.org.kde.polkit-kde-authentication-agent-1)(.*)$
  float = true
}

windowrule {
  name = float-zenity
  match:class = ^(zenity)$
  float = true
}

# Fix polkit losing focus
windowrule {
  name = stayfocused-pinentry
  match:class = ^(pinentry-)(.*)$
  stay_focused = true
}

# Fix pinentry losing focus
windowrule {
  name = stayfocused-polkit
  match:class = ^(hyprpolkit(agent)?)(.*)$
  stay_focused = true
}

