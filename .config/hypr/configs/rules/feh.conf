# Tagging
windowrule {
  name = tag-feh
  match:class = ^(feh)$
  tag = +feh
}

## Float things
windowrule {
  name = float-tagged-feh
  match:class = ^(feh)$
  match:tag = feh
  float = true
  # move = 90 95
  center = true
  # size = 1280 720
}
