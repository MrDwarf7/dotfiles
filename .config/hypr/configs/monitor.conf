################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = desc:Samsung Electric Company LS49AG95 HNTTB00033 (DP-1), 5120x1440@239.76, 0x0, 1,bitdepth,10,cm,hdr,sdrbrightness,1.45,sdrsaturation,0.98,

monitorv2 {
    output = DP-1
    mode = 5120x1440@239.75
    position = 0x0
    scale = 1.0
    transform = 0 
    vrr = 3
    bitdepth = 10

    ## srgb for 8bpc, wide for 10bpc if supported (recommended)
    # cm = auto
    ## sRGB primaries (default)
    # cm = srgb
    ### DCI P3 primaries
    # cm = dcip3
    ### Apple P3 primaries
    # cm = dp3
    ### Adobe RGB primaries
    # cm = adobe
    ### wide color gamut, BT2020 primaries
    # cm = wide
    ## primaries from edid (known to be inaccurate)
    # cm = edid
    ### wide color gamut and HDR PQ transfer function (experimental)
    # cm = hdr
    ### same as hdr with edid primaries (experimental)#
    cm = hdredid 

    supports_wide_color = 1
    supports_hdr = 1
    #
    # 1.8 is basically too high lol
    sdrbrightness = 1.250

    # sdrbrightness = 1.200000
    # ### pick one based on the cm = '' setting
    # sdrsaturation = 0.955 # hdredid
    # sdrsaturation = 0.98 # non hdr???? idk looks weird but web-pages etc. look normal 
    sdrsaturation = 1.175 # hdr
    #
    sdr_min_luminance = 0.005
    sdr_max_luminance = 145
    #

    sdr_min_luminance = 0.70
    sdr_max_luminance = 250

    # sdr_min_luminance = 1.215
    # # sdr_min_luminance = 2.105
    # sdr_max_luminance = 700
    # min_luminance = 0.005
    # max_luminance = 150
    min_luminance = 0.01  # Monitor's min luminance (float; based on your Neo G9 specs ~0.01 cd/m²)
    max_luminance = 1000  # Monitor's peak luminance (int; Neo G9 hits ~1000 nits in HDR)
    max_avg_luminance = 650
    sdr_eotf = default
}

# monitor = desc:Acer Technologies KA242Y 1201028BF3W01 (HDMI-A-2), 1920x1080@74, 5120x300, 1

monitorv2 {
    output = HDMI-A-2
    ## turn it off
    # disabled = true

    ## turn it on
    disabled = false

    mode = 1920x1080@74
    position = 5120x300
    scale = 1.0
    transform = 0
    bitdepth = 10
    vrr = 0
    # cm = auto
    # supports_wide_color = false
    # sdrbrightness = 1.0
    # sdrsaturation = 1.0

    # sdr_min_luminance = 1.00
    # sdr_max_luminance = 250
}

workspace = 1,monitor:DP-1
workspace = 2,monitor:DP-1
workspace = 3,monitor:DP-1
workspace = 4,monitor:DP-1
workspace = 5,monitor:DP-1
workspace = 6,monitor:DP-1
# workspace = 7,monitor:DP-1
# workspace = 8,monitor:DP-1

# Misc-off-hand - eg: Chat, Discord, etc.
workspace = 7,monitor:HDMI-A-2
# Off-hand tools - eg: Docker
workspace = 8,monitor:HDMI-A-2
# Music - eg: Spotify, YouTube Music, etc.
workspace = 9,monitor:HDMI-A-2
