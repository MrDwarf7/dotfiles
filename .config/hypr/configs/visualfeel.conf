# #########################
# $hyprdir = $HOME/.config/hypr
# source = $hyprdir/configs/programs.conf
# #########################

#####################
### LOOK AND FEEL ###
#####################

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    border_size = 1
    # border_size = 0
    # no_border_on_floating = true
    gaps_in = 6
    gaps_out = 4
    float_gaps = 0
    gaps_workspaces = 0

    col.inactive_border = rgba(595959aa)
    col.active_border = rgba(ffffffff)
    col.nogroup_border = rgba(ffff00ff)
    # layout = dwindle
    layout = master
    no_focus_fallback = false
    resize_on_border = true
    extend_border_grab_area = 15
    hover_icon_on_border = true
    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true
    resize_corner = 3

    snap {
        enabled = false
        window_gap = 10
        monitor_gap = 10
        border_overlap = false
        respect_gaps = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 0
    rounding_power = 2.0
    # Change transparency of focused and unfocused windows
    # active_opacity = 1.00
    active_opacity = 0.95
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.05
    dim_special = 0.2
    # dim_around = 0.01
    dim_around = 0.4
    # screen_shader = ""
    border_part_of_window = true

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        # size = 16                                           # default 8
        # passes = 6                                          # default 1

        # using size = 6 and passes = 4 for a good balance

        size = 4                                              # default 8
        # for is the sweet spot for colors popping + shape, but not crazy see-through
        # Heavy blur
        passes = 5                                            # default 1

        # Light blur
        # passes = 2                                            # default 1

        ignore_opacity = true
        new_optimizations = true
        xray = true
        # noise = 0.0117
        noise = 0.0000

        # high ranking here is lighter, lower is darker
        contrast = 0.4
        # contrast = 1.0
        # contrast = 0.9

        # note that the higher this goes, the more the colors will bleed through (good and bad)
        # brightness = 0.65
        brightness = 0.30
        # brightness = 0.8172
        vibrancy = 1.0
        # vibrancy = 0.1696
        vibrancy_darkness = 1.0
        special = false
        popups = true
        popups_ignorealpha = 0.2
        input_methods = false
        input_methods_ignorealpha = 0.2
    }

    shadow {
        enabled = true
        # range = 4
        range = 25
        render_power = 3
        sharp = false
        ignore_window = true
        color = rgba(1a1a1aee)
        # color_inactive = 
        # offset = [0, 0]
        scale = 1.0
        # scale = 1.5
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes
    # first_launch_animation = false
    workspace_wraparound = true

    bezier = fluid, 0.15, 0.85, 0.25, 1
    bezier = snappy, 0.3, 1, 0.4, 1
    animation = windows, 1, 3, fluid, popin 5%
    animation = windowsOut, 1, 2.5, snappy
    animation = fade, 1, 4, snappy
    animation = workspaces, 1, 1.7, snappy, slide
    animation = specialWorkspace, 1, 4, fluid, slidefadevert -35%
    animation = layers, 1, 2, snappy, popin 70%

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    # bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    # bezier = easeOutQuint,0.23,1,0.32,1
    # bezier = easeInOutCubic,0.65,0.05,0.36,1
    # bezier = linear,0,0,1,1
    # bezier = almostLinear,0.5,0.5,0.75,1.0
    # bezier = quick,0.15,0,0.1,1
    #
    # animation = global, 1, 10, default
    # animation = border, 1, 5.39, easeOutQuint
    # animation = windows, 1, 4.79, easeOutQuint
    # animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    # animation = windowsOut, 1, 1.49, linear, popin 87%
    # animation = fadeIn, 1, 1.73, almostLinear
    # animation = fadeOut, 1, 1.46, almostLinear
    # animation = fade, 1, 3.03, quick
    # animation = layers, 1, 3.81, easeOutQuint
    # animation = layersIn, 1, 4, easeOutQuint, fade
    # animation = layersOut, 1, 1.5, linear, fade
    # animation = fadeLayersIn, 1, 1.79, almostLinear
    # animation = fadeLayersOut, 1, 1.39, almostLinear
    # animation = workspaces, 1, 1.94, almostLinear, fade
    # animation = workspacesIn, 1, 1.21, almostLinear, fade
    # animation = workspacesOut, 1, 1.94, almostLinear, fade
}
