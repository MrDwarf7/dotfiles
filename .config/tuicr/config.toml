theme = "tokyo-night-storm"
# appearance = "system" ## Ignored when theme is set directly! 
# theme_dark = ""
# theme_light = ""

diff_view = "side-by-side"  # "side-by-side" | "unified"
commit_order = "descending" # "ascending" | "descending" ## Desc is newest at top
ignore_whitespace = false
show_file_list = true
mouse = true
# leader = ";"
leader = " "
comment_vim = true              # Vim modal editing inside of the comment box, can be toggled at runtime via `:vim`
comment_tab_width = 4
wrap = false
relative_line_numbers = true
cursor_line = true
transparent_background = true
scroll_offset = 5
no_update_check = false
review_watch_interval_ms = 1000

backend = "libgit2" # "libgit2" | "cli" ## Sparse-checkout repo's auto-route to cli variant!

comment_types = [
  { id = "note", label = "question", definition = "ask for clarification", color = "yellow" },
  { id = "suggestion", definition = "possible improvements" },
  { id = "issue", definition = "problems to fix" },
  { id = "praise", definition = "positive feedback" },
  { id = "nit", label = "nitpick", definition = "small optional tweaks", color = "#d19a66" },
]

[forge]
comment_type_prefix = true

[export]
intro = "I reviewed this code and have some comments. Please see below for my feedback."
scope_line = true
pr_metadata = true
comments_header = "## Comments"
remote_comments_header = "## Existing GitHub Comments"
legend = true
