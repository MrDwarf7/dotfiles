doubleEscapeAction: tree
treeFilterMode: default
autocompleteMaxVisible: 15
stt:
  modelName: parakeet
startup:
  quiet: true
features:
  unexpectedStopDetection: smart
memory:
  backend: mnemopi
edit:
  mode: hashline
readLineNumbers: true
