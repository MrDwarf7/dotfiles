  enabled: true
bashInterceptor:
  enabled: false
eval:
  py: true
astGrep:
  enabled: true
computer:
  enabled: false
vault:
  enabled: false
github:
  enabled: true
todo:
  eager: default
task:
  eager: preferred
  enableLsp: true
  maxRecursionDepth: 3
emojiAutocomplete: false
skills:
  enableAgentsUser: true
  enableClaudeUser: false
  enableCodexUser: false
  enablePiUser: false
  enableAgentsProject: true
  enableClaudeProject: true
  enablePiProject: true
enabledProviders:
  - claude
  - claude-plugins
composer:
  shape: box
defaultThinkingLevel: auto
autolearn:
  enabled: true
secrets:
  enabled: true