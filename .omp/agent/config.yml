modelRoles:
  default: xai-oauth/grok-4.5:high
  advisor: opencode-zen/nemotron-3.5-lightning-free
  smol: opencode-zen/laguna-s-2.1-free
symbolPreset: nerd
theme:
  dark: titanium
setupVersion: 2
statusLine:
  preset: default
  separator: powerline-thin
  sessionAccent: true
  transparent: false
terminal:
  showProgress: true
tui:
